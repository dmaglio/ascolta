[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audible-kde"
version = "0.1.0"
description = "Lettore di audiolibri per KDE Plasma, compatibile con Audible (Qt6 / Kirigami)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "audible>=0.13",
  "pycryptodome>=3.20",
  "python-mpv>=1.0.7",
  "httpx>=0.27",
  "dbus-fast>=2.0",
]
# PySide6 va installato dal sistema (Fedora: python3-pyside6, kf6-kirigami)
# Interfaccia GTK (ascolta-gtk): PyGObject, GTK4 e libadwaita dal sistema (Fedora: python3-gobject, libadwaita)

[project.scripts]
audible-kde = "audible_kde.app:main"
ascolta-gtk = "audible_gtk.app:main"

[tool.setuptools]
packages = ["audible_kde", "audible_gtk"]
[tool.setuptools.package-data]
audible_kde = ["qml/*.qml"]
